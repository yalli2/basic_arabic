<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://yalli2.github.io/site_main_control/guard.js" data-site="basic_arabic"></script><!-- smc-guard -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic Arabic · 기초 아랍어 인터랙티브 교실</title>
<meta name="description" content="국제학교 아랍어 수업용 인터랙티브 학습 사이트 — 글자, 발음, 문법, 회화, 숫자, 여행, 이집트 구어체까지 14개 단원과 자동 채점 연습문제">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app"></div>
<script src="data/meta.js"></script>
<script src="assets/app.js"></script>
<script src="assets/config.js"></script>
<script src="assets/chatbot.js"></script>
<script>
(function () {
  const { S, t, u, esc, T, LS } = BA;
  const root = document.getElementById("app");
  const L = (ko, en) => (S.lang === "ko" ? ko : en);
  function render() {
    BA.applyBig(); BA.stopAll();
    const meta = BA_META;
    const totalQ = meta.reduce((s, m) => s + m.nq, 0);
    let doneCh = 0, sumAvg = 0;
    meta.forEach(m => { const sc = BA.chapterScore(m.n, m.sets); if (sc.done === sc.total) doneCh++; sumAvg += sc.avg; });
    const overall = Math.round(sumAvg / meta.length);
    const nextCh = meta.find(m => BA.chapterScore(m.n, m.sets).done < m.sets.length) || meta[meta.length - 1];
    const secs = {};
    meta.forEach(m => (secs[m.sec] = secs[m.sec] || []).push(m));
    const card = m => {
      const sc = BA.chapterScore(m.n, m.sets);
      return `<a class="ccard" href="ch${String(m.n).padStart(2, "0")}.html">
        <div class="cctop"><span class="ccn">${m.n === 0 ? "★" : m.n}</span><span class="ccicon" dir="rtl">${esc(m.icon)}</span></div>
        <h3>${T(m.title)}</h3><p>${T(m.sub)}</p>
        <div class="ccmeta"><span>✎ ${m.sets.length} ${L("세트", "sets")} · ${m.nq} ${L("문항", "items")}</span><span>${sc.done ? sc.avg + "%" : ""}</span></div>
        <div class="bar"><i style="width:${sc.avg}%"></i></div></a>`;
    };
    root.innerHTML = BA.topbar(-1) + `<main class="home">
      <section class="hero">
        <div class="hin">
          <p class="kick">${L("국제학교 아랍어 수업 · 인터랙티브 교실", "International-school Arabic class · Interactive classroom")}</p>
          <h1><span class="h1ar" dir="rtl">العَرَبِيَّةُ لِلْمُبْتَدِئِينَ</span><span class="h1t">${L("기초 아랍어, 글자부터 대화까지", "Basic Arabic, from letters to conversation")}</span></h1>
          <p class="lead">${L("28글자 읽고 쓰기부터 문법, 일상 대화, 숫자와 시간, 여행 표현, 이집트 구어체까지. 모든 단원에서 원어민 음성을 듣고, 연습문제를 바로 풀고, 점수로 확인하세요.",
            "From reading and writing the 28 letters to grammar, everyday conversation, numbers and time, travel phrases and Egyptian dialect. Hear native-style audio, solve every exercise right here, and see your score instantly.")}</p>
          <div class="hcta"><a class="primary" href="ch${String(nextCh.n).padStart(2, "0")}.html">${doneCh ? L("이어서 학습하기", "Continue learning") : L("1단원부터 시작하기", "Start learning")} →</a><a class="ghostl" href="#map">${L("전체 단원 보기", "See all chapters")}</a></div>
          <div class="stats"><div><b>15</b><span>${L("단원", "chapters")}</span></div><div><b>${totalQ}</b><span>${L("연습 문항", "exercise items")}</span></div><div><b>${doneCh}</b><span>${L("완료 단원", "completed")}</span></div><div><b>${overall}%</b><span>${L("평균 점수", "average")}</span></div></div>
        </div>
        <div class="hart" aria-hidden="true"><div class="star"></div><div class="letters" dir="rtl">أ ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي</div>
          <button class="hello" data-play data-a="91da0ab54970" data-v="m" data-say="أَهْلًا وَسَهْلًا">🔊 <span dir="rtl">أَهْلًا وَسَهْلًا</span><small>${L("어서 오세요!", "Welcome!")}</small></button></div>
      </section>
      <section class="how"><h2>${L("이렇게 사용해요", "How to use this site")}</h2><div class="hgrid">
        <div><span>🔊</span><b>${L("듣기", "Listen")}</b><p>${L("아랍어 단어·문장·대화를 누르면 원어민 스타일 음성이 나와요. 상단 🔊 버튼으로 속도를 0.75배로 줄일 수 있어요.", "Tap any Arabic word, sentence or dialogue to hear it. Use the 🔊 button at the top to slow audio to 0.75×.")}</p></div>
        <div><span>Aa</span><b>${L("발음기호·모음부호", "Transliteration & vowels")}</b><p>${L("익숙해지면 발음기호(로마자)와 모음부호를 꺼서 진짜 아랍어처럼 읽어 보세요.", "Once you're comfortable, switch off transliteration and vowel marks to read like a native.")}</p></div>
        <div><span>✎</span><b>${L("연습과 채점", "Practise & check")}</b><p>${L("각 단원 끝의 연습문제를 풀고 ‘채점하기’를 누르면 점수와 정답·해설이 나와요. 최고 점수는 이 기기에 저장돼요.", "Solve the exercises at the end of each chapter and press ‘Check’ to see your score, answers and explanations. Best scores are saved on this device.")}</p></div>
        <div><span>🎤</span><b>${L("말하기", "Speak")}</b><p>${L("마이크 버튼으로 말하면 얼마나 비슷하게 발음했는지 보여 줘요 (Chrome·Edge).", "Use the mic button to see how close your pronunciation is (Chrome / Edge).")}</p></div>
      </div></section>
      <section class="map" id="map"><h2>${L("전체 단원", "All chapters")}</h2>
        ${Object.keys(secs).map(k => `<div class="secrow"><h3 class="secname s${k}">${esc(t(BA_SECTIONS[k]))}</h3><div class="cgrid">${secs[k].map(card).join("")}</div></div>`).join("")}
        <div class="secrow"><h3 class="secname s7">${L("마무리", "Wrap-up")}</h3><div class="cgrid"><a class="ccard final" href="final.html"><div class="cctop"><span class="ccn">✓</span><span class="ccicon" dir="rtl">اِمْتِحَان</span></div>
          <h3>${L("종합 테스트", "Final test")}</h3><p>${L("전 단원에서 무작위로 뽑은 20문항으로 실력을 점검해요.", "20 random questions from every chapter to check your progress.")}</p>
          <div class="ccmeta"><span>${L("최고", "Best")}: ${LS.get("best_final", null) == null ? "—" : LS.get("best_final") + "%"}</span></div></a>
          <div class="ccard tips"><h3>${L("공부 팁", "Study tips")}</h3><ul>
            <li>${L("1~3과(글자·발음)를 탄탄히 익힌 뒤 문법으로 넘어가세요.", "Master Chapters 1–3 before the grammar.")}</li>
            <li>${L("어휘는 매일 조금씩! ‘전체 듣기’로 반복해서 들어요.", "A little vocabulary every day — use ‘Play all’ to repeat.")}</li>
            <li>${L("문장은 꼭 소리 내어 따라 말해요.", "Always say sentences out loud.")}</li>
            <li>${L("각 단원 80% 이상이면 다음 단원으로!", "Score 80%+ before moving on.")}</li></ul></div></div></div>
      </section>
      <section class="teacher"><details><summary>${L("선생님·학생 도구", "Tools for teachers & students")}</summary>
        <p>${L("이 기기에 저장된 모든 점수 기록을 지웁니다 (수업 시작 전 공용 컴퓨터에서 사용).", "Erase all scores saved on this device (useful on shared classroom computers).")}</p>
        <button class="ghost" id="resetAll">🗑 ${L("점수 기록 초기화", "Reset all scores")}</button></details></section>
    </main>` + BA.footer();
    BA.bindTop(render);
    document.getElementById("resetAll").onclick = () => { if (confirm(L("정말 모든 점수를 지울까요?", "Erase all scores?"))) { Object.keys(localStorage).filter(k => k.startsWith("ba_best_")).forEach(k => localStorage.removeItem(k)); render(); } };
  }
  render();
})();
</script>
</body>
</html>
